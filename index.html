<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生旺奇门遁甲（离线版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{background:#ece4cf}
body{min-height:100vh;font-family:"Songti SC","STSong","SimSun",serif;background:linear-gradient(165deg,#f8f5ee 0%,#f2ecdd 60%,#ede5d2 100%);color:#33302a;min-height:100vh}
.wrap{max-width:940px;margin:0 auto;padding:26px 18px 70px}
h1{font-size:27px;text-align:center;letter-spacing:6px;color:#4a3f2c;margin:12px 0 14px;font-weight:700}
h1::before{content:"◆";color:#b08d57;font-size:14px;margin-right:12px;vertical-align:3px}
h1::after{content:"◆";color:#b08d57;font-size:14px;margin-left:12px;vertical-align:3px}
.sub{text-align:center;color:#9a8f79;font-size:12.5px;margin-bottom:20px;letter-spacing:1.5px}
.tabs{display:flex;flex-wrap:wrap;margin:4px 0 14px}
.tab{padding:8px 22px;margin:0 7px 8px 0;white-space:nowrap;cursor:pointer;font-size:15px;border-radius:22px;border:1px solid #cfc4a9;background:linear-gradient(180deg,#efe9d8,#e7dfc9);color:#6b5d45;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:all .18s ease}
.tab:hover{border-color:#b08d57;color:#4a3f2c;transform:translateY(-1px)}
.tab.on{background:linear-gradient(180deg,#a2824f,#8c6d3f);color:#fff;border-color:#8c6d3f;box-shadow:0 3px 8px rgba(120,90,40,.35)}
.searchbox{position:relative}
#q{width:100%;padding:15px 18px;font-size:17px;border:1.5px solid #c4b696;border-radius:13px;background:#fffdf7;outline:none;font-family:inherit;box-shadow:inset 0 1px 4px rgba(90,70,40,.07),0 1px 2px rgba(90,70,40,.05);transition:all .18s ease}
#q:focus{border-color:#8c6d3f;box-shadow:inset 0 1px 4px rgba(90,70,40,.07),0 0 0 4px rgba(176,141,87,.18)}
.hint{font-size:12px;color:#a2977f;margin-top:7px;letter-spacing:.3px}
#drop{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:5px;background:#fffdf7;border:1px solid #d3c8ad;border-radius:12px;max-height:360px;overflow:auto;display:none;box-shadow:0 12px 32px rgba(80,60,30,.18)}
#drop::-webkit-scrollbar{width:8px}
#drop::-webkit-scrollbar-thumb{background:#c9bfa8;border-radius:4px}
#drop .it{padding:11px 15px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid #f0e9d8}
#drop .it:last-child{border-bottom:none}
#drop .it.active,#drop .it:hover{background:#f3ecda}
.pair{font-weight:bold;font-size:16px;min-width:64px;color:#4a3f2c}
.gname{color:#7a6c52;font-size:14px}
.badge{font-size:11.5px;padding:3px 10px;border-radius:12px;margin-left:auto;white-space:nowrap;font-weight:700;letter-spacing:1px}
.b-吉{background:#e2efe0;color:#2e7d32;border:1px solid #c2dcc0}
.b-凶{background:#f7e4e0;color:#b3392f;border:1px solid #e8c6c0}
.b-门定{background:#f6eed6;color:#8a6d1d;border:1px solid #e4d5ab}
.filters{margin:18px 0 8px}
.frow{margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center}
.flabel{font-size:13px;color:#9a8f79;width:56px;margin-right:8px;flex:none}
.chip{display:inline-block;font-size:13px;padding:5px 15px;margin:0 10px 12px 0;white-space:nowrap;line-height:1.3;border:1px solid #bdb096;border-radius:16px;cursor:pointer;background:#fffdf7;user-select:none;transition:all .15s ease;color:#5f574a}
.chip:hover{border-color:#b08d57}
.chip.on{background:linear-gradient(180deg,#a2824f,#8c6d3f);color:#fff;border-color:#8c6d3f;box-shadow:0 2px 5px rgba(120,90,40,.3)}
#count{font-size:12.5px;color:#a2977f;margin:8px 2px}
#detail,#symdetail,#pandetail{background:#fffdf7;border:1px solid #ddd3bd;border-radius:14px;padding:26px 30px;margin-top:12px;box-shadow:0 4px 18px rgba(90,70,40,.10);line-height:2.0;font-size:16px}
#detail h2{font-size:21px;margin-bottom:6px;padding-bottom:10px;border-bottom:2px solid #e8dfc8;color:#4a3f2c}
#detail .meta{color:#9a8f79;font-size:13.5px;margin:12px 0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#detail .txt{line-height:2.05;font-size:16.5px;text-align:justify;color:#3a372f}
#detail .xj{background:#faf6ea;border:1px dashed #d3c6a5;border-radius:10px;padding:14px 18px;margin-top:16px;line-height:2.0;font-size:15px;color:#5a5344}
.xj-t{display:none}
mark{background:#ffe9a8;padding:0 3px;border-radius:3px}
.tag{display:inline-block;font-size:12px;background:#efe8d8;border-radius:5px;padding:2px 10px;margin-right:6px;color:#6b5d45;cursor:pointer;border:1px solid #ddd3bd;transition:all .15s}
.tag:hover{background:#e2d7bd}
.recip{margin-top:16px;font-size:13px;color:#a2977f}
.recip a{color:#8c6d3f;cursor:pointer;text-decoration:underline}
#list{margin-top:16px}
#list .it{padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid #ece4d2;background:#fffdf7;border-left:3px solid transparent;transition:all .12s ease}
#list .it:first-child{border-radius:10px 10px 0 0}
#list .it:last-child{border-radius:0 0 10px 10px;border-bottom:none}
#list .it:hover{background:#f5efe0;border-left-color:#c9b488}
#symdetail h3,#pandetail h3{font-size:20px;margin-bottom:8px;padding-bottom:9px;border-bottom:2px solid #e8dfc8;color:#4a3f2c}
#symdetail .sec,#pandetail .sec{margin-bottom:11px;color:#3a372f}
#symdetail .sec b,#pandetail .sec b{color:#8c6d3f}
#symdetail details,#pandetail details{margin-top:14px;border-top:1px dashed #cfc4a9;padding-top:10px}
#symdetail summary,#pandetail summary{cursor:pointer;color:#8c6d3f;font-size:14px}
#symdetail .ref,#pandetail .ref{font-size:14px;color:#5f574a}
#symdetail .ref p,#pandetail .ref p{margin:5px 0}
#symlist{display:flex;flex-wrap:wrap;margin-bottom:8px}
.symbtn{font-size:15.5px;padding:9px 20px;margin:0 8px 8px 0;white-space:nowrap;border:1px solid #cfc4a9;border-radius:11px;background:linear-gradient(180deg,#fffdf7,#f7f1e2);cursor:pointer;font-family:inherit;color:#4a3f2c;box-shadow:0 1px 3px rgba(90,70,40,.10);transition:all .15s ease}
.symbtn:hover{border-color:#b08d57;transform:translateY(-1px);box-shadow:0 3px 8px rgba(90,70,40,.18)}
.symbtn.on{background:linear-gradient(180deg,#a2824f,#8c6d3f);color:#fff;border-color:#8c6d3f}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.pcell{position:relative;background:linear-gradient(180deg,#fffdf7,#f9f4e7);border:1.5px solid #d3c8ad;border-radius:13px;padding:16px 10px 6px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hd hd" "god tg" "men tg" "star dg" "ft ft";align-content:start;column-gap:9px;box-shadow:0 2px 8px rgba(90,70,40,.08);transition:all .18s ease}
.pcell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(90,70,40,.16);border-color:#b08d57}
.pcell.on{border-color:#8c6d3f;background:linear-gradient(180deg,#f7f0dc,#f2ead2);box-shadow:0 0 0 3px rgba(176,141,87,.25),0 4px 14px rgba(90,70,40,.18)}
.pcell .pk{font-weight:bold;color:#8c6d3f;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.pcell .pm{color:#8a8378;font-size:12px}
.pcell .pl{font-weight:bold;color:#4a3f2c}
.pcell .mark{position:absolute;top:4px;right:4px;z-index:2;display:flex;flex-direction:row;align-items:center;gap:3px}
.pcell .mark i{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:9px;font-weight:700;line-height:1}
.pcell .mark i.mk-ms{background:#e03131;color:#fff;box-shadow:0 1px 3px rgba(150,30,20,.35)}
.pcell .mark i.mk-kw{background:#fffdf7;color:#c0392b;border:1.5px solid #d98880;box-shadow:0 1px 3px rgba(150,30,20,.25)}
.pstem{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px;line-height:1.14}
.ptg{font-size:36px;font-weight:700;color:#8c2f22;text-shadow:0 1px 0 #fff}
.pdg{font-size:36px;font-weight:700;color:#2f4f6f;text-shadow:0 1px 0 #fff}
.pline{font-size:14px;text-align:center;color:#3a372f}
.pm2{font-size:12.5px;text-align:center;color:#8a8378}
.panctl{margin-bottom:8px;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;color:#5f574a}
.panctl input{padding:8px 10px;margin:0 4px 6px 0;border:1.5px solid #c4b696;border-radius:9px;font-family:inherit;font-size:15px;width:64px;background:#fffdf7;outline:none;transition:all .15s;text-align:center}
.panctl input:focus{border-color:#8c6d3f;box-shadow:0 0 0 3px rgba(176,141,87,.18)}
#paninfo{display:inline-block;background:#f3ecd7;border:1px solid #d8cbab;border-radius:10px;padding:9px 18px;color:#6b5d45;font-size:15.5px;margin-bottom:8px;line-height:1.7}
.pansub{font-size:12.5px;color:#a2977f;margin-bottom:8px}
.pc-hd{grid-area:hd;display:flex;justify-content:flex-start;align-items:center;font-weight:bold;color:#8c6d3f;font-size:14px;line-height:1.25;margin-bottom:13px}
.pc-god{grid-area:god;justify-self:start;font-size:13.5px;font-weight:700;color:#a06a12;letter-spacing:2px;display:inline-block;background:linear-gradient(180deg,#f8efdb,#f0e3c4);border:1px solid #e2d2aa;border-radius:10px;padding:1px 10px 1px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);margin:2px 0}
.pc-men{grid-area:men;font-size:16px;font-weight:700;color:#4a3f2c;align-self:center;letter-spacing:1px}
.pc-tg{grid-area:tg;justify-self:end;align-self:center;display:flex;align-items:center;gap:7px}
.pc-tgc{display:flex;flex-direction:column;align-items:flex-end;font-size:31px;font-weight:700;color:#8c2f22;line-height:1.12;text-shadow:0 1px 0 #fff}
.pc-jg{font-size:31px;font-weight:700;color:#7a3fa0;line-height:1.12;text-shadow:0 1px 0 #fff}
.pc-star{grid-area:star;font-size:13px;font-weight:700;color:#3d5a3a;align-self:center;letter-spacing:1px}
.pc-dg{grid-area:dg;font-size:31px;font-weight:700;color:#2f4f6f;text-align:right;line-height:1.12;text-shadow:0 1px 0 #fff;align-self:center}
.pc-ft{grid-area:ft;font-size:11px;color:#8a8378;text-align:center;margin-top:4px}
@media (max-width:560px){
.wrap{padding:16px 10px 50px}
.chip{display:inline-block;font-size:12.5px;padding:4px 12px;margin:0 7px 10px 0;white-space:nowrap;line-height:1.3}
.flabel{width:48px;font-size:12px;margin-right:6px}
.tab{padding:7px 14px;font-size:13.5px;margin:0 5px 7px 0}
h1{font-size:19px;letter-spacing:3px}
.sub{font-size:11.5px;margin-bottom:14px}
.tab{padding:7px 14px;font-size:13.5px}
.pg{gap:6px}
.pcell{padding:7px 8px;column-gap:6px;border-radius:11px}
.pc-hd{font-size:12px}
.pc-god{font-size:12.5px;letter-spacing:2px;margin:2px 0 3px}
.pc-men{font-size:16px}
.pc-tg,.pc-dg{font-size:23px}
.pc-star{font-size:14px}
.pc-ft{font-size:10px;margin-top:4px}
#q{font-size:15px;padding:12px 14px}
#detail,#symdetail,#pandetail{padding:18px 16px;font-size:15px}
.panctl input{width:52px;font-size:14px;padding:7px 6px}
}
.pc-io{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:2px;opacity:.9}
.pc-io.in{background:#e03131}
.pc-io.out{background:#1971c2}
.pc-csc{display:block;font-size:10.5px;letter-spacing:2px;margin-top:1px;font-weight:700}
.pc-csc.w{color:#2e7d32}
.pc-csc.p{color:#8a6d1d}
.pc-csc.s{color:#b3392f}
#panmodal{position:fixed;inset:0;background:rgba(40,30,15,.18);z-index:200;display:none;align-items:flex-end;justify-content:center}
#pandlg{background:rgba(255,253,247,.93);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);width:100%;max-width:680px;max-height:82vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -6px 34px rgba(0,0,0,.28);overflow:hidden}
#pandlg-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:2px solid #e8dfc8;font-weight:700;color:#4a3f2c;font-size:16px;flex:none}
#pandlg-x{font-size:28px;line-height:1;cursor:pointer;color:#8a8378;padding:0 8px;border-radius:8px}

#pandlg #pandetail{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px;margin-top:0;border:none;border-radius:0;box-shadow:none;max-height:none;flex:1 1 auto;background:#fbf7ec}

}

}
.hd{background:linear-gradient(140deg,#26211b 0%,#3b3025 45%,#4f3f29 78%,#5b4a2f 100%);border-radius:18px;padding:36px 18px 18px;margin-bottom:18px;box-shadow:0 6px 20px rgba(60,45,20,.35),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden;text-align:center}

/* ===== 网格化重设计：筛选组与符号按钮 ===== */
.frow{display:block;margin-bottom:10px}
.flabel{display:block;width:auto;margin:0 0 6px;font-size:12px;letter-spacing:3px;color:#a2977f}

<script>

var KE = [{"g": "戊", "d": "戊", "n": "青龙伏吟", "l": "凶", "t": "甲甲比肩，名为“青龙伏吟”。遇此，凡事不利，道路闭塞，以守为好。伏吟主本地，主内部，主迟，如果是六甲之时问事，尚可谋为行动。", "pair": "戊加戊", "x": "名为伏吟，凡事不利，道路闭塞，以守为好。测投资，资本难以周转，要双倍的投。测出行，戊就是山，阻隔重重，会堵车。测婚姻，没有动向，难变。测疾病，有肿胀的地方、胃胀难受、不想吃东西、混混沌沌、想睡觉。测办事，一次办不成，需要不断的完善和补充才能办成。戊加戊作用在人身上，主愚钝、无知、不转弯、死心眼；作用在人事上，闭塞不通，推行不开，迟缓。"}, {"g": "戊", "d": "乙", "n": "青龙和会", "l": "门定", "t": "甲、乙均为东方木，东方木又名青龙，故名为“青龙和会”。门吉事也吉，门凶事也凶。", "pair": "戊加乙", "x": "青龙和会，门吉事吉，门凶事也凶。这是一个合格，必有他人他事牵连。遇到好的中间人(门)，事情就吉，反之则凶。测投资代表股份制、合作等。测办事有人帮。测病，多种病。遇到此格，要特别注意门的影响。凶门或吉门门迫，应吉的效果就很不理想。此格利于合作和聚集，不利于一个人独立做事或独立出行。戊加乙，乌云遇到日头，云开雾散。乙是日头，作用在人事上事情明朗，贵人相帮；作用在地理上主清风和煦，鸟语花香；从神助上讲，花点钱敬神——乙奇神咒。"}, {"g": "戊", "d": "丙", "n": "青龙返首", "l": "吉", "t": "即甲子戊在天盘，丙奇在地盘，由于甲木生丙火，丙火又生戊土，丙火是甲木的儿子，是克制庚金的主力，所以在奇门中列为第一吉格，名为“青龙返首”。凡求好事，诸如求婚、求学、求财、求官、出行、出国、建造、出征、打仗等，均大吉大利。但如果“青龙返首”的格局遇上门迫(即门克宫，特别是凶门克宫)、入墓(如甲子戊落乾宫入戌墓)或击刑(如甲子戊落震宫形成子卯刑)，则吉的程度大减，吉事不成，甚至吉事成凶。正因为此格利于好事，所以坏事遇此，反而不吉，如测疾病，遇此格，不仅不吉，反而可能显示病情十分严重。", "pair": "戊加丙", "x": "青龙返首，动作大吉，但若逢门迫、入墓、击刑，则吉事成凶。测投资，投进去的资本又回来了，发财啊。但就怕入墓和击刑：戊落乾宫入墓了，破财；落震宫击刑了，损财；戊落巽宫最吉。门迫不好，主会遇到人事上的变化，戊想回来，但门被锁死了，回不来。此格测疾病——坏了，旧病复发，主反复。测要债，很好，要回来了，但有乱子。打官司，还得重审。测出行，打架妻子失踪了，还会回来。但我遇到多次，去异地卖货，遇此格卖不了，龙返首，货又回来了，但钱却花费了。命盘“青龙返首，鳌头独立”，主金榜题名。测婚姻戊加丙，男方为百里挑一的女婿、女方为华贵娇娘。青龙返首就是往返照耀之意。丙是月亮，开始时是乌云遮月，后来是月出云没。喻人事，开始时挺难的，一片混乱，后来有眉目了，见到光明，事物必有转机。"}, {"g": "戊", "d": "丁", "n": "青龙耀明", "l": "吉", "t": "即甲子戊在天盘，丁奇在地盘，甲木生丁火，丁火生戊土，也是主客相生。故列为第三吉格，名为“青龙耀明”。也是对求取好事，诸如求婚、求学、求官、求财等大吉大利。由于甲子戊为主帅，所以古人讲宜见上级领导、贵人；又由于丁奇主文书、主文明，所以利于求取功名富贵。但是，如果丁奇入墓(如丁奇落艮宫入丑墓)或遇门迫(门克宫，特别是凶门克宫)，则不仅吉的程度大减，甚至会招来是非。", "pair": "戊加丁", "x": "青龙耀明，宜见上级领导、贵人，求功名，为事吉利，若值墓迫，招惹是非。丁主希望、机遇、奇迹，一般说来是好事，但如果一个男的来求测，那他可能外面有女人。测公关，需要动用少女。测病，需要动手术。测运气，主人生有重大机遇。命盘“戊加丁奇，富贵荣耀”。青龙耀明，即闪耀着一点光明，一丝丝的光线，代表希望和奇迹。这个光明也受到外力的影响，门吉则吉，门凶则枉费心机。门吉，一点点光明，再加上人为的助力，则希望加大；门凶，刚有一点希望又被外来因素破坏了。"}, {"g": "戊", "d": "己", "n": "贵人入狱", "l": "凶", "t": "即甲子戊在天盘，甲戌己在地盘。由于天盘戊入地盘戌之墓库，所以名为“贵人入狱”凶格，于公于私都不利。只有等待冲出墓库之时，才能有转机。这是站在天盘甲子戊为贵人的角度讲的。", "pair": "戊加己", "x": "贵人入狱，公私皆不利。己为陷阱，戊为钱，钱掉到陷阱里了，主破财。测投资为合伙投资、各怀鬼胎，钱不到位。己是私欲，想美事。打官司，有好事也实现不了。贵人入狱，测牢狱，出不来。找贵人，此人帮不上忙。逢这种格局，就是能力不足的问题，只有等待冲出墓库之时，才能有转机，一般说来还能挺过去，困难是暂时的。而戊加壬青龙入天牢，却是长久的困惑之象。在人事上，看起来有人帮你这事可行，但贵人的能力不足；又戊为钱，你可能经济实力不行。"}, {"g": "戊", "d": "庚", "n": "值符飞宫", "l": "凶", "t": "即甲子戊加甲申庚。因值符甲最怕庚辛金克杀，天盘值符甲在地盘遇到庚金，自然要躲避，故名为“值符飞宫”格。甲为青龙为吉神，庚为白虎为阻隔凶神，所以测好事不吉，凶事更凶，求财没利益，测病也主凶。惟一的出路，就是值符甲飞离此宫，所以遇此格，又主换地方、换人。", "pair": "戊加庚", "x": "值符飞宫，吉事不吉，凶事更凶，求财没利益，测病也主凶。同时，甲庚相冲，飞宫也主换地方。这是一个动格，肯定动，不会安份的。测工作，肯定要换。临生门，换房子，改生意，换地方。临开门，工作调整。测投资，钱换主人了。开店要迁址，选房子，住不长。测什么，什么都呆不住。经商遇到戊加庚或庚加戊，主此地不比他地，即不能在此地做生意，有时候可以转换门庭就好了。命盘“庚加戊，戊加庚，多成多败，此地不比他地”，必然遇到反复较量的斗争局面，最好是避开对手，换地经营。如果是合作或做事，主不是一路人，你所说的事和他做的事不是一回事，合作不到一块去。测运气，为事业的转成，换行业或换单位。测病，为转移。测坟地，景加戊加庚加腾蛇，不能用，主坟换地方，因景为路，故以后这地方要修路。测什么换什么，代表转移走。"}, {"g": "戊", "d": "辛", "n": "青龙折足", "l": "凶", "t": "即天盘是甲子戊，地盘是甲午辛。由于辛金克甲木，子午又相冲，所以名为“青龙折足”格，吉门有生助，尚能谋事；若逢凶门，主招灾、失财，或有足疾、折伤。这是站在天盘甲的角度讲的。", "pair": "戊加辛", "x": "青龙折足，吉门有生助，尚能谋事；若逢凶门，主招灾，失财或有足疾、折伤。如果是年轻人求测，可能是腿脚上有毛病。测财运，肯定是破财，无论落在哪个宫都是破财，只是落宫不同，破财的形式或者破财的地方不一样。这是一个冲格，干什么都要动，但这个动是错误的。测投资，投错了。测工作，换错地方了。测出行，容易腿脚受伤。测事情，要出问题、夭折、半道折损、半途而废。测怀孕，要防流产。测疾病，为增生类的疾病。冲格，指动态的事情。此格坐不住，也留不住，最忌讳投资，此局做事，就发生不利的变化。作用在人事上，主半途而废或者出现扯后腿的人或意外闪失。遇到戊加辛，开始顺，则以后不顺；开始不顺，则马上要顺利。"}, {"g": "戊", "d": "壬", "n": "青龙入天牢", "l": "凶", "t": "即天盘为甲子戊，地盘为甲辰壬。由于壬为天牢，甲为青龙，子水又入辰墓，故名为“青龙入天牢”凶格。在这里千万不可按字面上的五行生克来看，比如说“戊土克壬水”、“壬水生甲木”，必须按遁甲的特殊关系来看。由于“青龙入天牢”，所以不论公开的事还是隐蔽的事都不利。这也是站在天盘甲子戊为用神的角度讲的。", "pair": "戊加壬", "x": "青龙入天牢，凡阴阳事皆不吉利。此格也主破财，主钱财收不回来，借出的钱，打水漂了。壬水主变化，戊是什么，什么就变化了。投资，亏本。测婚姻、钱财、工作、公司等，都要发生不利的变化。此格也代表运气不好，办不成事，处在一个低潮期。当官的遇此格没好事，要不就是犯错误，要不就是退二线、下台或进去了。青龙代表权位，代表政府官员，壬水牢狱，动了。此格也是一个变动格。测工作，也是要动的。测疾病，病要走了，好事啊。此格表示贵人失陷，小人挡道，被小人牵扯。要注意身边的人或当地地方的人牵扯、陷害。外出求财、做事，受到当地地方势力的欺凌。"}, {"g": "戊", "d": "癸", "n": "青龙华盖", "l": "门定", "t": "即甲子戊加甲寅癸。因甲为青龙，癸为地网，又名华盖，故名为“青龙华盖”格。由于甲与癸一阴一阳，水能生木，又戊与癸相合，所以吉凶由门来定，即逢吉门为吉，可招福临门；逢凶门为凶，事多不成。", "pair": "戊加癸", "x": "青龙华盖，又戊癸相合，故逢吉门为吉，可招福临门；逢凶门，事多不利，为凶。逢合必有勾连、合伙。不仅论天地盘之合，也论天禽星和天芮星所带之干。逢合为多，为合伙。婚姻为不是第一次或表示同居。事情有合绊、障碍。戊看的是癸的性，癸看的是戊的钱。有钱的找性感的女孩，性感的女孩爱嫁有钱的人。戊土也为诚实憨厚的人，赖汉娶娇妻也是戊癸合。戊癸为利而合，也可以说是无情之和。测婚姻，为年龄差距大。测病，为多种病。测出行，必有他人他事牵连、有瓜葛。出行遇到冲格比较好。这个格，有吉有凶。癸为天网，戊为天武。你想做兵戈之事或你想变化，需要通过天网。它既有保护你的意思，也有钳制你的意思。此格中间要有一个媒介即和事佬。门吉则吉，门凶枉费心机。就是说，在外界事物影响推动他的时候，双方有合作的意思；门凶，则说明双方合作没有用，反而互相钳制，大家都干不好。"}, {"g": "乙", "d": "戊", "n": "阴害阳门", "l": "门定", "t": "前边的戊加乙，为甲子戊在天盘为客，乙奇在地盘为主，阳木与阴木会和，由门来决定其吉凶，门吉事也吉，门凶事也凶。现在二者颠倒过来了，乙奇在天盘为客，甲子戊在地盘为主，为客必然主动进攻，这时乙木就会克戊土，故名为“阴害阳门”(戊为阳土为天门，己为阴土为地户)。利于阴人、阴事，不利阳人、阳事，也就是说对女人或隐蔽性的事情有利，对男人或公开性的事情不利。决定吉凶，还是看门。如果门吉，尚可谋为；门凶、门迫，则要破财伤人。", "pair": "乙加戊", "x": "阴害阳门，利于阴人阴事，不利于阳人阳事，就是说不利于公开的事情，利于女人、利于暗中行事。对于男人来讲，如果遇到吉门尚可谋为，门凶、门迫则破财伤人。此局不利于做表面文章。当然，乙加戊，戊为财，测来意等可以看做为财而来啊，或者为合作融资的事情而来等。要是测离婚——这个钱归老婆了（乙木为女人，利阴害阳）。为什么叫阴害阳门？因为戊土为阳门、天门，乙木来克制戊土，起坏作用。遇此格，要看门，门逢凶迫，财破人伤。遇到了这样的格局怎么办？可以委托女人去办；白天不做晚上做。男命遇到这样的局，就不宜主动的去做，要等事情发生以后再出击。"}, {"g": "乙", "d": "乙", "n": "日奇伏吟", "l": "凶", "t": "即乙乙比肩，名为“日奇伏吟”格。不宜见上层领导和贵人，不宜求名求利，只宜安分守己。也就是伏吟利主，宜静不宜动，宜守不宜进。", "pair": "乙加乙", "x": "日奇伏吟，不宜见上级领导、贵人；求名求利及进取事不可求，只宜安分守己。为什么呢？乙木为希望，乙木又主曲折，都是阴干，相互排斥啊，所以这类伏吟，就是曲折更多了。乙是日奇，是太阳，太阳不能有两个。测事，进度不大，拐弯的事情多啊。测婚姻也好不了，就是希望太多了，个个就虚无缥缈。乙多出来一个，那么庚肯定也要多出来一个，所以伏吟主多婚或二婚。测人事方面，这事不是自己一个人干的，因为多出来一个，是与别人合伙的，而且参与人多，伏住了，进展就慢。遇此格，测出行走不了或曲折多发。测出国，走不动，被缠住了。“道路曲折，但并不是前途光明”。逢乙加乙，利主，宜静不宜动，宜守不宜进。"}, {"g": "乙", "d": "丙", "n": "奇仪顺遂", "l": "吉", "t": "天盘为日奇，地盘为月奇，乙木又生丙火，故名为“奇仪顺遂”格，谋事多吉。但在测婚中，乙奇代表妻子，丙奇代表第三者男人，如果乙奇临吉星，说明此人本质好，在官场主客关系处理得好，故能迁宫晋职；如果乙奇临凶星，说明此女本质不好、作风坏，难免与第三者男人搞到一起，故出现夫妻反目离别的情况。", "pair": "乙加丙", "x": "奇仪顺遂，吉星加官尽职，凶星夫妻反目离别。星代表一个人的先天秉性，这个格局是吉还是凶，取决于所临之星是吉星还是凶星。乙木为阴木，丙为阳火——一阴一阳，绝妙搭配。乙委屈，丙火乱子。一个想出头、一个怕出头——二人融合，则奇仪顺遂了。乙加丙，丙为权威啊，就是贵人多的意思，公开做有公开的贵人，暗中做有暗中的贵人。木火通明之象，就是有贵人扶持。但是女人测，特别是摊上凶星，第三者就要来了，这女人作风不好。男人测，则他可能成为第三者。乙加丙有好事，但这个好事是伴着乱子麻烦来的。再次强调，乙加丙，临吉星谋事多吉；临凶星求谋不顺，特别是不利于婚姻。"}, {"g": "乙", "d": "丁", "n": "奇仪相佐", "l": "吉", "t": "即天盘为乙奇，地盘为丁奇，乙木生丁火，故名为“奇仪相佐”吉格，最利文书、考试，百事可为。", "pair": "乙加丁", "x": "奇仪相佐，最利文书、考试，百事可为。为什么？丁主文书、证件、希望、机遇、奇迹，乙也是希望——三奇占了两奇，而丁是希望直达，所以测事会有奇迹发生，有好的机遇。测年运，此年机遇多，希望大，易成功。当然，测婚姻就有第三者了。女人测表示她可能成为别人的第三者。男人测，他有第三者或者老婆不是原配。《奇门遁甲秘笈大全》讲：“丁乙同宫，另续相亲。乙奇在上，妻妾和谐；丁在乙上，妾幸夫心”。遇此格，主有新的机遇，有新的选择。"}, {"g": "乙", "d": "己", "n": "日奇入墓", "l": "门定", "t": "即天盘为乙奇，地盘为甲戌己。由于戌为乙木之墓，故名为“日奇入墓”格，即乙奇被土埋没。如果门凶，事必凶。如果门吉，则有救；得开门则为地遁吉格。", "pair": "乙加己", "x": "日奇入墓，被土暗昧、门凶事必凶。为什么叫日奇入墓？甲戌己啊，乙木入戌墓啊，这样乙奇就发挥不出它的作用了啊。己为坟地、为陷阱，这样是把希望掉到陷阱里了，做什么事情就都不好成功了！乙加己——己是被窝，是私欲，是幻想，就是躺在被窝里想好事，真的让他干，他干不成，也不去干，是空想。遇此格，希望渺茫，也是希望不明确的含义。查病，病因不明。测事，希望渺茫。这个格局与乙加戊不利男人相反，是不利于女性做事，女性去了就倒霉。这个格局适合男性做事、白天做事。遇此格，要看门，门凶事必凶。如果门吉，为有救。遇开门，为地遁吉格。（乙加己遇开门为地遁：利隐蔽企图、建立网点、策划谋为、设计行事。探秘、伏藏、和谈、求贤、交易、婚育吉。）测风水，遇地遁，主坚固稳重。测疾病遇地遁，病潜藏的深，有死亡的可能。"}, {"g": "乙", "d": "庚", "n": "日奇被刑", "l": "凶", "t": "即乙木在上，庚金在下，虽然乙、庚合为夫妻，但阴在上，阳在下，违反常规，庚金刑克乙木，故名为“日奇被刑”格，往往会夫妻不合，为争讼财产，各怀私意。", "pair": "乙加庚", "x": "日奇被刑，为争讼财产，夫妻各怀私意。为什么这样说？虽然乙庚合为夫妻，但阴在上阳在下，违反常规，庚金克乙木，故名日奇被刑。这是一个合格，逢合，就不是一个人干的事情。乙庚虽然在同宫里，但他们的落宫状态不一样，并不是步调一致的。我记这个局——用“同床异梦”来理解。出行逢此格，夫妻同去，不好走，有牵连。测调动，碰到这样的格局，往往也是牵连的事情很多，工作难调。如果女性求测，乙加庚一般是问婚姻上的事情，婚姻上有矛盾。“日奇被刑，庄生嗟叹”，命盘出现这样的格局，对妻子不利。如测恋爱，有可能是同居了。乙加庚测合作，也是各怀鬼胎。强调遇此格，有争讼，各怀私意。"}, {"g": "乙", "d": "辛", "n": "青龙逃走", "l": "凶", "t": "乙在上，辛在下，乙为青龙，辛为白虎，辛金冲克乙木，而且是阴克阴，故名为“青龙逃走”凶格，主家破人亡，财散人走，奴仆拐带，六畜皆伤。在测婚中，遇此格，一般皆为妻子主动提出离婚，离开男方。", "pair": "乙加辛", "x": "青龙逃走，人亡财破，奴仆拐带，六畜皆伤。测婚姻为女逃男。为什么？乙为女人，落到了辛金这个刀子上，能不吓跑吗？辛金主错误，主问题，主变革。乙加辛——测什么事都有问题发生。这是一个动格，不得不动、不能不动啊。两个阴性的相排斥，同性力量大。此局，测婚姻，婚姻要动了，要变革了。测疾病——疾病要跑了，变好事了。测求财，龙逃走，破财了。这也是一个出走的代表符号，如调动、出差等。“青龙逃走，懦弱之人，更主因妻成败，而且驼背驼身”，命盘遇此格，男人必是性格软弱、胆小怕事、没主见、靠老婆支撑家庭、且体矮驼背、相貌丑陋。强调这是一个凶格，百事皆凶，举兵主客皆伤，经商破财，测婚婚散。但我们也注意到乙加辛，如果遇到开休生三吉门之一，则为“云遁”格局，宜于军事、旅游、修炼，宜于求雨。遇云遁，临事也不宜强求，暗中算计对方，对方不易发现。乙加己、乙加辛、丙加戊、丙加庚、丁加壬、丁加癸，再遇地盘值使门就是“三奇得使”吉格。三奇得使它只能是在事物大凶时，稍向好的方向转化，而不至于大凶；在事物大吉时，能锦上添花罢了。测风水乙加辛，房子或院墙有破损的地方。遇云遁，视线开阔。经商遇到乙加辛、辛加乙，合作双方或竞争双方相互不信任。"}, {"g": "乙", "d": "壬", "n": "日奇入天罗", "l": "凶", "t": "乙奇在天盘，甲辰壬在地盘。由于壬为天罗，乙为日奇，故名为“日奇入天罗”凶格，主尊卑悖乱，官讼是非，有人谋害之事。", "pair": "乙加壬", "x": "日奇入天罗，尊卑悖乱，官讼是非，有人谋害之事。为什么？乙木为日奇，壬水是天牢，壬水本来是生乙木的，但是因为它有了牢狱的性质，这样乙加壬就如同坐牢了，能力不好发挥，所以叫尊卑悖乱。像这类情况，我们可以断他背后有小人捣鬼，这个事情要起变化了。因为壬水主流动，此格表示事物还没有定局、还在变化。尊卑悖乱，捣鬼的人可能是他的手下或以前的下属。测婚姻，可能是年龄差距大或差辈等。要点：尊卑悖乱，有人谋害。"}, {"g": "乙", "d": "癸", "n": "日奇入地网", "l": "凶", "t": "乙奇在上，甲寅癸在下。癸水虽生乙木，但癸为地网，故名为“日奇入地网”凶格，宜退不宜进，以躲灾避难为吉。", "pair": "乙加癸", "x": "日奇入地网，宜退不宜进，隐匿藏形，躲灾避难为吉，此格局不利于进攻。为什么？癸水是脏水，是地网。我们现在说网络是癸水的性质之一，也是起于癸水为地网的含义。日奇撞到网里了，不怎么好。测病，病入网了，好不了。测财，财入网就是好事。抓贼，贼入网，跑不了。乙加癸——癸水就是有制约，是出于私欲的破耗，被人拖后腿了。乙加癸，妻子受委屈。测命盘日干遇到乙加癸或癸加乙，此人可能有特异功能。要点——宜退不宜进，不利进攻，躲灾避难为吉。但我们要知道乙加癸遇开休生三吉门或落坎宫为“龙遁”，宜于水战、修桥、凿井。如测凿井，此处必有甘泉。乙加癸临玄武，大雨成灾。"}, {"g": "丙", "d": "戊", "n": "飞鸟跌穴", "l": "吉", "t": "前边的戊加丙，戊为客、丙为主，客生主，主生客，主客相生，对“甲”最有力，所以为第一吉格。现在主客颠倒过来，丙为客、戊为主，甲木生丙火，丙火生戊土，仍是主客相生。主主静，客主动，丙火是甲木的儿子，现在主动回到母亲身边，所以名为“飞鸟跌穴”，列为奇门第二吉格。此格也是对谋好事大吉大利，诸如求婚、求学、求财、求官等，不用费多大力气，就能成功。同样，如果遇上门迫(特别是凶门克宫)、入墓(如丙入乾宫戌墓)或者击刑(如在震宫，地盘甲子戊形成子卯刑)，则吉的程度会大减，甚至吉事不成，反而变凶。另外，此格同“青龙返首”一样，测坏事则不吉。如测疾病，遇此格，不仅显示病重，甚至可能是病人去世入穴的征兆。", "pair": "丙加戊", "x": "飞鸟跌穴，事业可为，可谋大事，对好事大吉大利，如求婚、求财、考试、求官等，不用费多大力气，就能成功。求财遇此格，财来了，到财库了。测病遇此格，麻烦了，病到内部去了，不好去根了。飞鸟跌穴，此格重点在于这个“跌”字，跌，就是跌倒了这里。测什么，跌来了什么。测打官司，要倒霉赔钱了。测出行，有返回之意。测婚姻遇丙加戊、戊加丙，男方为百里挑一的女婿，女方为华贵新娘。注意：此格遇到凶迫（凶门克宫）、墓、击刑，则吉的程度会大减，甚至吉事不成，反而变凶。“财官生旺，盖因飞鸟跌穴”，命盘日干遇此格，必财官两旺、荣华显耀。测风水生门或时干临丙加戊，主住宅雕梁画栋、藏风聚气，是官稳财聚的房子。"}, {"g": "丙", "d": "乙", "n": "日月并行", "l": "吉", "t": "与前边的乙加丙相反，主客关系颠倒过来，丙奇在上，乙奇在下，即阳在上，阴在下，这符合事物一般规律，故名为“日月并行”吉格，公谋私为皆为吉利。", "pair": "丙加乙", "x": "日月并行，公谋私为皆为吉。一个比较剧烈，一个比较消极，事物的协调性就比较好，做事有张有弛的，丙火想出乱子，乙木阴柔的提醒，乙木不敢做的事情，丙火来做，所以说这是个比较好的格局，利于合作、合伙、求谋。"}, {"g": "丙", "d": "丙", "n": "月奇悖师", "l": "凶", "t": "天地盘皆为丙奇，即月奇伏吟，由于丙的性格暴躁，办事容易偏激过火，不守常规，主客二个丙到一起，犹如午午自刑一样，更加重了丙奇的缺点，故名为“月奇悖师”格，主文书逼迫，破耗遗失，特别是容易出现单据票证遗失不明的情况。", "pair": "丙加丙", "x": "月奇悖师，文书逼迫，破耗遗失，主单据、票证不明遗失。此格是火上浇油。丙火就是麻烦乱子，性格暴躁、办事容易偏激过火，丙加丙不就乱套了吗？像热锅上的蚂蚁，乱了方寸。此格虽然乱，但是伏吟，乱也没有好法子的，拖拉难受。因为丙火主文章、票据、单子、凭证，所以遇此格，常常是票据等不明遗失了，做会计工作的应特别注意。此格，凡是过犹不及，要防患于未然。"}, {"g": "丙", "d": "丁", "n": "星奇朱雀", "l": "吉", "t": "天盘为丙，地盘为丁，阳在上，阴在下，丙火又名朱雀，丁为星奇，故名为“星奇朱雀”，二奇阴阳互补，自然为吉，所以主贵人文书吉利，常人平静安乐。如果再逢开、休、生三吉门，则为天遁吉格。", "pair": "丙加丁", "x": "星奇朱雀，贵人文书吉利，常人平静安乐，得三吉门为天遁。此格不错，太阳之火和星星之火到一起比较如意。但测病就不好，丙丁火都是炎症，代表心脏、眼睛、血液，代表手术。丙代表重症，丁代表局部炎症。这玩意要真是测病，麻烦也不小，发烧也能烧死。这格局，如果是女性测情人，这情人还有别的女人。丙加丁或丙加戊与生门同宫为天遁格，丁加休门加太阴为人遁格，遇这两个格，在较长时间内夫妻恩爱、相敬如宾。测风水，临天遁，宅舆高大，遇人遁一团和气。"}, {"g": "丙", "d": "己", "n": "火悖入刑", "l": "门定", "t": "即丙奇在上，下遇甲戌己。因丙火入戌墓，故名为“火悖入刑”格，逢吉门得吉，逢凶门得凶，主囚人刑杖，文书不行。", "pair": "丙加己", "x": "火悖入刑，囚人刑杖，文书不行，吉门得吉，凶门转凶。丙火比较盛烈，己土比较阴柔，它想掉到己土的陷阱里还进不去，己土想缠绕丙火，还缠不住，这种情况进退维谷，比较难受。丙为希望，己土为私欲，背后捣鬼、奸诈，遇到此格临凶门表示表里不一，表面一套、背后一套，表面为人师表，实际男盗女娼，一肚子坏水，是无耻的小人。遇此格，多是因为自私行为和幻想惹出的麻烦，但多数情况下出现的问题是能够解决的。"}, {"g": "丙", "d": "庚", "n": "荧入太白（贼退）", "l": "凶", "t": "天盘为丙奇，地盘为庚。由于丙为朱雀，为荧惑火星，庚为太白金星，故名为“荧入太白”。由于阳火克阳金，二者争战不已，故谋求好事，遇此为大凶格，主门户破败、盗贼耗失、事业难成。但如果测敌人、仇人、贼盗来不来，由于奇门多以庚为敌人、仇人、贼盗的符号，而现在天盘有丙火克制庚金，所谓“火入金乡贼即去”，故又名此格为“贼退”格。敌人、仇人、盗贼退去，这自然为吉了。", "pair": "丙加庚", "x": "荧入太白，贼必去。门户破败，盗贼耗失，事业亦凶。这是个动格，测什么都是动的。测工作，要离职或调动，此人不想干，主动的走。测出行，此人特别想去，你拦也拦不住。如果测求财，一般不是太有利，往往破财，但临生门可以说要出去做生意，不能说是破财。如果测病，此格容易病情好转。此格的要点是一个“去”字，就是主动的去。因为它是个阳干，阳干主主动。谋求好事，遇此格为大凶格。但如果测敌人、仇人、盗贼来不来，遇此格贼退去，自然就是吉利的了。商战中，利主不利客，利退不利进，利于卖货。但测命盘遇“荧入太白者，退，主家业萧条”，是讲日干丙遇此格，如果不积极主动谋事，采取消极退让的态度，则必然破家败财。测风水如果生门时干逢此格，要防火灾破财。"}, {"g": "丙", "d": "辛", "n": "月奇相合", "l": "吉", "t": "丙在上，辛在下。丙火克辛金，丙为月奇为阳，又与阴金辛相合，故名为“月奇相合”吉格。凡谋事能成，测人疾病也不凶。", "pair": "丙加辛", "x": "日月相会，谋事成就，病人不凶。丙辛合是权威之合，相互之间为利益、权势而合作，遇到合格都是拖拖拉拉的事、合作的事，一个人干不了的事。此格是在错误中互相利用，好像局面很乱，实际大局是稳定的。此格虽然合作中会出现一些问题，但这些问题能够解决。利于合作、利于等待，不利于出行。遇此格要看门，格局衰弱、遇凶门，则易犯错误。"}, {"g": "丙", "d": "壬", "n": "火入天罗", "l": "凶", "t": "天盘为丙，地盘为壬。由于壬、丙对冲，壬又为天罗，故名为“火入天罗”凶格，为客不利，是非颇多。", "pair": "丙加壬", "x": "火入天罗，为客不利，是非颇多。壬丙相逢是非多，是一对矛盾。这些麻烦都是因为外部原因导致的，并不是因为自己的失误或错误造成的。这乱子中还有变化，釜底抽薪，越往前进乱子事越多。此格为客不利，则不宜进。"}, {"g": "丙", "d": "癸", "n": "月奇地网", "l": "凶", "t": "天盘为丙奇，地盘为癸水，癸水克丙火，癸在下又名地网，故名为“月奇地网”格，凡事暗昧不明，容易由阴人、小人害事，招来灾祸。", "pair": "丙加癸", "x": "月奇地网，阴人害事，灾祸频生，凡事暗昧不明。指阴人、小人、看不见的人，搞一些破坏性的东西，也是指犯小人，背后有人捣鬼，招来灾祸。遇到这样的格局，要从内部找原因、找身边人是否在捣乱。丙加丁、丙加壬癸临伤门、死门、马星等，煤气管道或自来水管道易泄露。"}, {"g": "丁", "d": "戊", "n": "青龙转光", "l": "吉", "t": "即丁奇在天盘，甲子戊在地盘，与前边的戊加丁相反。但仍是主客相生，所以列为第四吉格，名为“青龙转光”。因甲木生丁火，丁火在上，光明更加显著。所以，诸如求婚、求学、求财、求官等好事会更加顺利。故古人讲遇此格“官人升迁，常人威昌”，也就是说，即使平民百姓遇此吉格，也会事业发达、声名卓著。同样，如果遇到入墓或门迫之时，吉的程度会大减，甚至招来是非。", "pair": "丁加戊", "x": "青龙转光，官人升迁，常人威昌。无论遇到多大困难，将来都会出现转机。开始不好，后来好。诸如求婚、求学、求官等好事会更加顺利。此格如果遇到入墓或凶门门迫其吉利的程度会大减，甚至招来是非。命盘日干丁加戊“青龙转光，邑长县令”，官运好。"}, {"g": "丁", "d": "乙", "n": "玉女奇生", "l": "吉", "t": "与前边的乙加丁相反，主客关系颠倒，仍是相生关系，由于丁为玉女，得到乙奇相生，故名为“玉女奇生”格，贵人加官晋爵，常人婚姻财帛有喜。", "pair": "丁加乙", "x": "人遁吉格，贵人加官进爵，常人婚姻财帛有喜。“丁乙同宫，另续相亲”，乙主曲折变化，丁、乙都是阴干，此格表明事物会有新的变化或者转化。测婚姻，有新的变化，那可能是离婚了，或者在外面有新的女人了。测生意，可能有新的生意或者选择新的合作伙伴。丁奇在天盘，乙奇在地盘，则必然是小妾受到丈夫的宠爱，在家中说了算，此格有焕然一新的新奇感觉。测婚姻不吉，不要老婆了。要注意，实际上此格有点消极，但对于文书、合同方面的事情比较有利。测工作，为要调动、原来的工作不理想或保不住。丁加乙叫人遁吉格。在九遁中还有一个“人遁”，即天盘丁奇加休门加太阴，那个格局，也是谋为吉利。"}, {"g": "丁", "d": "丙", "n": "星随月转", "l": "门定", "t": "与前边的丙加丁相反，主客颠倒，变为阴在上，阳在下，名为“星随月转”。如果是贵人可越级高升，巧妙利用阴阳互补的优势；如果是平常人，往往不能忍受“阴阳颠倒”的状态，反而容易乐里生悲，造成不幸。", "pair": "丁加丙", "x": "星随月转，贵人越级高升，常人乐极生悲，要忍，不然因小的不忍，而引起大的不幸。表示这个事情很难驾驭，星星想支配月亮，那哪行？一个老百姓是享受不了这个福分的。这就是小马拉大车，能力不够，乐极生悲，这事看着挺好，但你如果不是有能力的贵人或有大贵人帮助的人，你驾驭不了，好事就变成坏事了。就是说，我们普通人遇此格，还是要保持冷静、收敛一下为好，不要做过头的事，慎防物极必反，造成不幸。"}, {"g": "丁", "d": "丁", "n": "星奇伏吟", "l": "吉", "t": "名为“星奇伏吟”格。由于丁奇最灵，其他天干伏吟都不吉、不宜动，惟独丁奇伏吟，仍然为吉，主文书证件即至，喜事从心，万事如意。", "pair": "丁加丁", "x": "星奇入太阴，文书证件即至，喜事从心、万事如意。星星之火可以燎原，群星点缀天空。丁加丁也表示幻想太多。测婚姻男朋友或女朋友多。测疾病不吉，有重复多次手术之象。其他格局伏吟，主不宜动，唯独丁奇伏吟，仍然为吉。"}, {"g": "丁", "d": "己", "n": "火入勾陈", "l": "凶", "t": "即天盘丁奇，地盘为甲戌己。由于戌为阳火之库，己(对应地支为丑)为阴火之库，己土又名勾陈，故名为“火入勾陈”格，主有阴私之事，谋求不利，奸私仇冤，事因女人。", "pair": "丁加己", "x": "火入勾陈，奸私仇怨，事因女人。星星掉到井里了，看不到希望了。测事要小心女人或遭到女人、小人、暗中做事之人在背后的捣鬼。看婚姻，可能是男性外面有女人引起了感情不和。遇此格，常常因个人的事情或私人的事情，出现意外或问题。"}, {"g": "丁", "d": "庚", "n": "星奇受阻", "l": "凶", "t": "天盘丁奇，地盘庚，丁为文书，庚为阻隔之神，故名为“星奇受阻”格，庚主文书阻隔、消息不通；但是如果是外出之人或走失之人，遇庚受阻，故又主行人必归。", "pair": "丁加庚", "x": "星奇受阻，文书阻隔，行人必归。测去干事，停滞不前又回到了起点，就是这个事情不太好成，有阻力。测婚姻，有情人，但难以离婚，因为行人必归，又回来了。此格会回到起点上来。遇事，有需要回避或退守之意。测信息，主文书阻隔、消息不通。"}, {"g": "丁", "d": "辛", "n": "朱雀入狱", "l": "凶", "t": "天盘丁奇，地盘甲午辛。甲午辛为罪人，辛又为监狱，故名为“朱雀入狱”格。从地盘罪人辛的角度讲，上遇丁奇，自然为吉，所以主“罪人释囚”；如果从天盘丁奇来讲，丁奇为官人、为贵人，遇到辛这个主错误、主犯罪的符号，也就是说当官的有职权的人犯了错误、有了牢狱之灾，必然要失掉原来的地位，所以又主“官人失位”。", "pair": "丁加辛", "x": "朱雀入狱，罪人失囚，官人失位。这个格表明干事容易犯错误、出现问题。实际上，测领导是在其位不谋其政。丁为希望，辛为错误，希望变成错误了。对于当官的和我们一般的人求事而言，这个格不好，希望被转化了，当官的要下台了。对于已经处于极地的人或地位极低的人，本来就在低谷，一转化反而会好了，失囚倒是好事。测办文凭的事情，遇丁加辛，临玄武的格局，我说你是办假文凭吧，他说是的。我说别办了，你会上当的。他不信，讲是他姐夫的一个大学老师帮助办，关系很硬。我说那也不行。结果他又邀请了其他2个朋友，共缴费5万多去办证。结果那老师跑掉了，打官司都无门。测消息是否属实，景门宫中逢丁加辛，这个格说明消息失位，也不准确。"}, {"g": "丁", "d": "壬", "n": "奇仪相合", "l": "吉", "t": "天盘丁，地盘壬，名为“奇仪相合”格。因丁与壬相合，壬又为天罗，与讼狱有关，所以主凡事有成，贵人辅助，讼狱公平。测婚遇此，因丁壬合为淫荡之合，故多为苟合关系，但也不可一概而论。", "pair": "丁加壬", "x": "奇仪相合，贵人恩诏，诉狱公平。测婚姻多为苟合媾和。逢合格，测出行或者合作都是有牵连。此格测婚姻，未婚先同居，是淫荡之合，表明肉体上的感受比较敏感一些，肉体享受比较多。测合作也非道义的合作，是不正常的合作，将来会出事。但一般说来，这还是吉格，主事情能成，有贵人辅助，讼狱公平。"}, {"g": "丁", "d": "癸", "n": "朱雀投江", "l": "凶", "t": "丁在上，癸在下。丁为阴火，癸为阴水，又为地网，二者又对冲，故名为“朱雀投江”凶格。主文书口舌是非，经官动府，词讼不利，音信沉溺不到。", "pair": "丁加癸", "x": "朱雀投江，文书口舌是非，经官动府、词诉不利，音信沉溺不到。如果测出行坐飞机，可能飞机会出事故。测疾病，要命了。测房事男上女下。测什么都是办事难成，手续办不下来。乘船，翻船。测卖货，主货物卖不出去，再便宜也没人要，还招惹口舌是非。测风水生门时干临此格主家中口舌频多。“朱雀投江，刀笔书吏”，命盘日干临此格可能做法官、调解员。测婚姻，遇丁加癸，主婚后夫妻双方易发生口舌，还要防媒人居心不良。"}, {"g": "己", "d": "戊", "n": "犬遇青龙", "l": "门定", "t": "即甲戌己在天盘，甲子戊在地盘，与前边的戊加己相反。由于戌为犬为狗，甲为青龙，故名为“犬遇青龙”；这也是站在天盘甲戌己角度讲的。因为一般以天盘三奇六仪为用神。“犬遇青龙”格，如果门吉，则谋事可以实现；如果门凶，则枉费心机。这又体现了主客关系的吉凶，主要由八门的吉凶来决定。因八门代表人事。", "pair": "己加戊", "x": "犬遇青龙，戌为犬，甲为龙，故名犬遇青龙。门吉为谋望遂意，上人见喜；若门凶，枉费心机。这体现了主客关系的吉凶，主要由八门的吉凶来决定，因八门代表人事。此格遇吉门，主有贵人帮助，有了施展才华的机遇和新生事物的发生。己土本来是藏在地下的东西，现在放在了阳地上，有人要帮你了，你升值了，做好的肥料了。测投资，有人要给你出资。我理解此格是一人得道鸡犬升天，是个借鸡下蛋沾光揩油的格局。己是明堂，天象是晴空万里；戊是云彩，在地成山。己加戊，事态明朗，叫犬遇青龙。狗骑龙，美是美，得有人帮你。所以门吉则吉，门凶则凶。外界会影响到他俩的组合搭配，是遇到贵人相帮之意。但有时贵人也会变成小人，要看外面的情况。贵人得谗言，就会害你；得贵人美言，就助你。"}, {"g": "己", "d": "乙", "n": "地户逢星", "l": "凶", "t": "甲戌己在上，乙奇在下，与前边的乙加己相反，换了主客关系，一般均以天盘三奇六仪为用神，故站在己的角度，己为地户，乙为日奇，故名为“地户逢星”格，宜遁迹隐形，宜退不宜进。", "pair": "己加乙", "x": "墓神不明，戌为乙木之墓，己又为地户，故名墓神不明，地户逢星，宜遁迹隐形为利。此格不好，庄稼长在了坟地里，长在了井里，长在了地户里，表示这个事不明确。测事，不要去做，你自己都还没有搞清楚。测疾病，不能确诊，只是怀疑。测事，表示这个事还不清楚，没有眉目，只看到了太阳的影子，没有看到太阳。测投资，看不到市场的变化。测前途，前途渺茫，自己搞不清自己的位置。此格，一般做事拖拉，看不见光明，这本身就不是很好的事，没有头绪，却还要去做。这个格局不宜进取。"}, {"g": "己", "d": "丙", "n": "火悖地户", "l": "凶", "t": "与前边的丙加己相反，阴阳颠倒，己在天盘，丙在地盘，戌为火墓，己又名地户，故名为“火悖地户”凶格，如果男人遇此格，容易冤冤相害；女人则易被人奸污。", "pair": "己加丙", "x": "火悖地户，己在天盘，丙在地盘，戌为火墓，己为地户，阴阳颠倒，所以叫火悖地户凶格。如果男人遇此格，容易冤冤相害；女人则易被人奸污。测合作，双方合作不成功，反而遭一些麻烦事、不痛快的事。丙是太阳之火，落到井里了，它不干啊，所以相互攻击。测婚姻：女性测，脚踏两只船，张郎来了想李郎；男性测，到处沾花惹草、寻花问柳。测对手，则乱来，两败俱伤。此格表明会因为不正确的思想和行为，造成一些麻烦事。遇此格，主麻烦是非，由于私心而产生的问题，犯小人，且知道小人是谁。"}, {"g": "己", "d": "丁", "n": "朱雀入墓（地户朱雀）", "l": "门定", "t": "天盘甲戌己，地盘丁奇。因戌、丑为火墓，丁奇为南方火，又名朱雀，故名为“朱雀入墓”，这又是从地盘丁的角度所讲。实际天盘为客，应从天盘角度来讲，不妨改名为“地户朱雀”格，地户遇丁奇毕竟为吉，所以此格主文书词讼，先曲后直，先凶后吉。", "pair": "己加丁", "x": "朱雀入狱，天盘甲戌己，地盘丁奇，因戌、丑都为火墓，丁奇为南方火，又名朱雀，所以叫朱雀入狱。就是丁火落到井里了，但星星是埋不住的，表示开始时有曲折变化，但坚持下去就会有好的机遇。我理解此格，就是道路是曲折的，前途是光明的。经过困难、曲折和磨难之后会有转机，所以此格主文书词讼，先曲后直，先凶后吉。不要冒进，不要急于求成，要缓一步才能成功。"}, {"g": "己", "d": "己", "n": "地户逢鬼", "l": "凶", "t": "天地盘均为甲戌己，己又名地户，故名为“地户逢鬼”凶格。测病遇此格，发凶或必死。求谋好事不成，可暂不谋为，谋为则凶。", "pair": "己加己", "x": "地户逢鬼，病者发凶或必死，百事不遂，暂不谋为，谋为则凶。阴土会阴土，见不得人的勾当，想美事，这个事还成不了。此格主暗中做事，不见阳光，而这个事情做不成功。贪欲太强，自私心重，做事无力，光做美梦。我理解这个格局就是花花肠子一大堆，偷鸡不成蚀把米，聪明反被聪明误。测疾病见鬼了，难好。测出行，路上坑坑洼洼。测人事，到处都是陷阱。"}, {"g": "己", "d": "庚", "n": "刑格返名", "l": "凶", "t": "因为庚加己为刑格，现在主客反过来了，故名为“刑格返名”。庚为阻隔之神，所以不宜谋事，词讼先动者不利，如临阴星则有谋害之可能。", "pair": "己加庚", "x": "刑格返名，词讼先动者不利，如临阴星（凶星）则有谋害之情。庚为阳隔之神，所以不宜谋事。为什么遇阴星有谋害之情？己为阴，本身就是阴谋，再遇阴星这个事情就更不透明了，被人暗中算计了。遇到庚，大多都是刑格，因为庚为天刑，是破坏性的。己加庚，就是破坏平静的气场。遇此格，测事，你不能先动，因为你先做，才出事，你不做则没事。测疾病，多为受伤之意，有时皮肤受伤，有时精神受伤，是难受、别扭、受伤害。遇此格想办的事办不成，那条路走不通，还得回来。"}, {"g": "己", "d": "辛", "n": "游魂入墓", "l": "凶", "t": "即甲戌己加甲午辛。戌为午火之墓。己为地户，辛主罪人，又主骸骨。故名为“游魂入墓”格，主人鬼相侵，住宅易遭阴邪鬼魅作祟，凡事须小心谨慎为妥。", "pair": "己加辛", "x": "游魂入墓，易招阴邪鬼魅作祟。己为地户，戌为午火之墓，辛主罪人，又主骸骨，坟墓里有骨头，主人鬼相亲，住宅易遭阴气。凡事需小心谨慎为妥，这就是两个坏蛋凑到一起了，相互捣鬼，被人捣鬼。如果对方临此格，这是你给人家捣鬼。测房子，不干净，有阴气、有鬼。遇此格，容易上当犯小人，阴人作祟，惊怪之事。用神临此格，就是被小人或被自己不清晰的事情捣鬼或扰乱。这个格局，特别忌讳测房子。测坟地，更需特别注意，如果是还没使用的地时，遇此格说明以前这里有坟；如果是已经安葬的坟墓，遇此格有可能别人要侵占这块地做坟地。古书中讲：遇此格被人借气了。测人事则是犯小人，背后有人整你。"}, {"g": "己", "d": "壬", "n": "地网高张", "l": "凶", "t": "己为地户，壬为天网，己在上，壬在下，故名为“地网高张”凶格。凡事不吉，谋为不利。一阴一阳暗中冲克，己为阴，壬为阳，甲戌己与甲辰壬又有辰、戌相冲，故易出狡童侠女，奸情伤杀之事。", "pair": "己加壬", "x": "地网高张，狡童佚女，奸情伤杀，凡事不吉，谋为不利。一阴一阳暗中冲克，逢冲必动，暗中的私欲要起变化了，没有好事。己壬同宫，天罡与地煞谁也不服谁，表示争斗之事。测什么事都代表要动。壬为天牢，这事难成功，动了也没有好的结果。遇此格，容易犯小人。这也是个冲格。辰为天罡，戌为地煞，起争执、口舌、斗打、狡童佚女、狗叫蛇咬，没好事。"}, {"g": "己", "d": "癸", "n": "地刑玄武", "l": "凶", "t": "甲戌己加甲寅癸。己土克癸水，癸水又在北方玄武之位，故名为“地刑玄武”凶格，主男女疾病垂危，有囚狱词讼之灾。", "pair": "己加癸", "x": "地刑玄武，男女疾病垂危，有囚狱词讼之灾。己土克癸水，癸水又在北方玄武之位，故名地刑玄武凶格。也不是什么好事，癸、己都主有问题。癸主污秽之事，为天网，容易出犯法之事或容易有疾病发生。都是暗地里的事，本身就是不正确的东西，会引起一些问题的发生。测病，为性病。遇此格也主口舌是非，而且容易上当受骗。凡是阴配阴、阳配阳，都不是特别好，但最终体现在地支的刑冲合害上。己为地户、癸为天网，也是暗昧之意。临网必有口舌争讼。"}, {"g": "庚", "d": "戊", "n": "值符伏宫（天乙伏宫）", "l": "凶", "t": "即甲申庚在天盘，甲子戊在地盘，与前边的戊加庚“值符飞宫”格正好相反。也就是说，值符甲在地盘，天盘飞来庚金，如泰山压顶一般，冲克甲不能动弹，故名为“值符伏宫”格，又名为“天乙伏宫”格。这也是站在甲的角度讲的。所以，从甲的角度说，遇到庚金冲克，自然是大凶之格，百事不可为。惟一出路也是换地方、换人。因而古籍在总结人生经验预测中说“庚加戊，戊加庚，多成多败，此地不比他地”。但是，如果用神是天盘庚，不仅不凶，反而为吉，求财(甲子戊为钱财)一定会“多成”，然而由于甲与庚相冲，在甲当令旺相之时，庚金难免被囚，成“多败”之势，所以还是换地方、换人为好。", "pair": "庚加戊", "x": "天乙伏宫，百事不可谋，大凶。唯一出路，也是换地方、换人。古人云：庚加戊、戊加庚，多成多败，此地不比他地。但是如果用神是天盘庚金，不仅不凶，反而为吉，求财一定会多成。然而，由于甲与庚相冲，在甲当令旺相之时，庚金难免被囚，成多败之势，所以还是换地方、换人为好。遇到此格，主客不利，求人不在，等人不来，不是伤人就是伤钱。最怕测合作之事，测合作，准有倒霉事，谁测谁倒霉。因为这是个动格，不完善、不完美。最忌讳坐地求财，开公司、店铺、当口，与伙伴搭档干不到一块去，有小人，分赃不均，因钱的问题打仗，见利忘义。测婚姻逢庚加戊、戊加庚，主夫妻品行不佳，如不讲道理、有外遇、道德品质差等。"}, {"g": "庚", "d": "乙", "n": "太白逢星", "l": "凶", "t": "与前边的乙加庚相反，换了主客关系，故名为“太白逢星”格，由于庚克乙、乙庚又相合，所以为客有利，为主就不利了，只宜退不宜进了。", "pair": "庚加乙", "x": "太白逢星，退吉进凶，谋为不利。为合格，男测女帮，女测男爱。测出行，有勾连之事。测举事，受牵绊，则不宜动。测婚姻，两口子吵架，互不干涉，谁也不管谁。遇此格，主留恋、牵绊，有合伙人，与异性合伙好。男上女下，符合正理。委曲求全，事就好办。命盘遇庚加乙，或乙加庚“太白逢星，妻室常病”，因庚金刑克乙木，妻子身体不好。合格，利于合作，只要你处在委曲求全的状态之下，合作就是愉快的。退而求其次，事就好办。"}, {"g": "庚", "d": "丙", "n": "太白入荧（贼来）", "l": "凶", "t": "即天盘为庚，地盘为丙。天盘为客为动为进，地盘为主为静为守。现在作为敌人、仇人、盗贼、阻隔之神的庚主动进攻来了，虽然丙火能克庚金，但丙火在下，处于不利和被动状态，因而站在甲的角度来讲，这自然是大凶之格。故名为“太白入荧”凶格，又名为“贼来”格。占贼，贼必来，须防敌人来偷营，盗贼入室来抢劫，所以以固守为好。但在实际应用中，如果求测之日干或年命即为庚，庚就是我方，当然此格变为吉格了，必然“为客进利，为主破财”了。只要主动进攻，先发制人，就会有利于自己。", "pair": "庚加丙", "x": "太白入荧，贼必来，为客进利，为主破财。占贼贼必来，需防敌人来偷营，盗贼入室来抢劫，所以要固守为好。但在实际运用中如果求测之日干或年命即为庚，庚就是我方，当然此格就变为吉格了，必然为客进利，为主破财了。只要主动进攻、先发制人，就会有利于自己。测财，财来。临生门会有钱送上门来。女性遇此格，外面必有情人，有男人主动追你。测客人来不来，遇此格客人必来。测官司，官司要来了。测疾病，病来了。测店铺，遇此格再遇玄武，易失窃。测婚姻遇到庚加丙、丙加庚：同床异梦、情感表里不一，常常是三角恋爱或有情人牵连的符号。命盘“太白入荧者，进，主先贫后富”，日干逢此格，只要积极主动去谋事，会先贫后富，逐步改变贫穷的状态，富裕起来。"}, {"g": "庚", "d": "丁", "n": "亭亭之格（金屋藏娇）", "l": "凶", "t": "与前边的丁加庚相反，主客颠倒，庚在上，丁在下。故名为“亭亭之格”，不妨改为“金屋藏娇”格，因庚属阳金，为男人，丁为玉女为情人。故主因私匿或男女关系起官司是非，门吉有救，门凶事必凶。", "pair": "庚加丁", "x": "亭亭之格，因私匿或男女关系起官司是非，门吉有救，门凶事必凶。此格，就是金屋藏娇、包二奶、关系不正常。男性来测，是引诱小姐找三陪去了，有情人。女性来测，主此人是第三者。测事业，主因为一己私利出是非，损公肥私，被人告状了，出事了。命盘“星逢太白，帷薄丑声”，是说命盘遇丁加庚或庚加丁，会出现婚外恋，使家中名声不好。"}, {"g": "庚", "d": "己", "n": "官府刑格", "l": "凶", "t": "庚在上，己在下。名为“官府刑格”，主有官司是非，因官讼被判刑，住牢狱更凶。庚为阻隔之神，为凶的符号，但己为地户为丑为庚之墓地，所以二者相遇，无论为主为客都不吉利。", "pair": "庚加己", "x": "官府刑格，主有官司口舌，因官讼被判刑，住牢狱更凶，百事不利。庚为阳隔、己为地户，为丑土，即庚金的墓地，所以两者相遇无论为主为客都不吉利。刑格就是难受、别扭、心灵或肉体上受到伤害。己为私欲，想暗中伤害。这个难受是不情愿的，是被别人拖累的。测婚姻为婚姻受伤；测合作，为互相伤害，官灾横祸。测身体身体受伤。测什么，什么受伤，什么就起争执。经商破财，出行患病，做事受阻、拧劲。求财遇到刑格和悖格，要尽早撤出，又主企业内部不团结。测婚姻遇到庚加己刑格或者悖格，夫妻双方脾气暴烈，做事不计后果，易发生家庭暴力。"}, {"g": "庚", "d": "庚", "n": "太白同宫（战格）", "l": "凶", "t": "名为“太白同宫”，又名为“战格”。二个凶神相遇，必然相互争斗，所以主同事、朋友或兄弟之间不和，不仅不利谋事，而且还容易招来官灾横祸。", "pair": "庚加庚", "x": "太白同宫，又名战格，官灾横祸。兄弟或同辈朋友相冲撞，意见不一。这个格，伏不住，打仗，仇人相见分外眼红。测工作，遇到此格，肯定动，他坐不安稳的。逢庚就打架、争执、争斗。测合伙，干不成，打的头破血流。测婚姻，两男争女。测求财，竞争激烈。测公司，主内部乱套，内忧外患，要重组了。要注意这个格局却是利客不利主，不利于呆着静守，而是要积极行动、敢于战斗和攻击，才能克敌制胜，谁先动谁有利。命盘庚加庚，主兄弟雷攻，必主客相斗，与兄弟姐妹同事合伙人争斗、相互攻击。冲格，战格。最不利合作，合作必打架。老人测，时干见庚加庚，两儿子打架，不合。"}, {"g": "庚", "d": "辛", "n": "白虎干格（太白刑格）", "l": "凶", "t": "庚辛均为白虎，二者相遇，故名为“白虎干格”。因庚为太白金星，故又名为“太白刑格”。远行不利，诸事有灾殃。", "pair": "庚加辛", "x": "白虎干格，不宜远行，远行车折马伤，求财更为大凶，诸事有灾殃，时间越长越凶。庚辛金都是虎，一山不容二虎。这个格局最怕动，一动就出事。但是，他很少能听进你的话，非动不可。测出行要小心伤灾。办事容易摔跟头。遇此格为主没事，不妨以静待劳观其变。此格，也主打架受伤，因冲动打斗之事。"}, {"g": "庚", "d": "壬", "n": "小格（上格·移荡格）", "l": "凶", "t": "庚加壬名为“小格”，又名为“上格”。壬水主流动，庚为阻隔之神，故主远行迷失道路，音信不通。但如果站在庚的角度，庚若为用神，遇壬水流动，又有变动、变化之意，所以此格又名为“移荡格”。", "pair": "庚加壬", "x": "移荡格，上格又名小格。金化水流，主远行迷失道路，男女音信难通、变动、外出。壬水主流动，庚金为阻隔，故远行道路迷失，男女音信难通。但如果站在庚的角度，庚若为用神，遇壬水流动，又有变动、变化之意，所以叫移荡格。从主客关系来讲，利于客，逢此格必动。测工作，有变动之象，但是一般是岗位的调动、单位内部的调整。测运气，身心不安、劳心劳力，是来回的跑，谈业务的。庚加壬为小格，小在哪里？是指这个变动的范围不大，是本地。此格主忧患，主奔波劳累，不安定、求谋不遂。出行有阻，但堵车堵不住。测婚姻，遇庚加壬、庚加癸：婚后分居，常常配偶一方在家，独守空房，如两地分居或配偶经常出差不回家等，因而也代表鳏寡孤独。若庚处衰地，再逢凶星凶神凶门，则夫妻一方可能早亡，无法白头偕老。测消息是否真实，如果景门遇庚加壬，也为消息不真实。命盘遇庚加壬“小格者，暂时清贫”，如果能审时度势，及时改变自己的处境，经过奋斗也能富裕。"}, {"g": "庚", "d": "癸", "n": "大格", "l": "凶", "t": "庚加癸名为“大格”，因甲申庚与甲寅癸之间寅申相冲相刑，故为大凶之格。庚又为道路，所以多主车祸，行人不至，官讼不息。如果测生育，则可能母子俱伤。", "pair": "庚加癸", "x": "大格，因寅申相冲，庚为道路，故多主车祸，行人不至，官司不止，生育母子俱伤，婚姻易鳏寡孤独。此格为什么主大动？冲的力量大。比如从河南去了广东。大格者，萍迹四海，就是跑到外地去了。如果格局组合好，为去外地创业，到外地发展去了或为高官、为大领导服务的人。若格局衰，是给人打工的。测工作，不是经常出差跑业务的，就是要调动工作了。等人不来，求人不在，经商破财，出行车毁马死，只宜扑捉罪犯。命盘“大格者，萍迹四海”，主一生漂泊不定，四海为家。"}, {"g": "辛", "d": "戊", "n": "困龙被伤", "l": "凶", "t": "与前边的戊加辛相反，主客换了位置，甲午辛在天盘，甲子戊在地盘。故名为“困龙被伤”格，这又是站在甲的角度讲的。因甲在地盘，受到辛金冲克，所以被困受伤，主凶。如果委曲求全、安分守己尚可，妄动则带来祸殃，或吃官司，或破财。但是，如果用神是天盘的辛，那就不仅不凶反而为吉，也可以说“为客无害了”，当然由于子午相冲，挣到手的钱也容易花掉，所以也有不吉的一面。", "pair": "辛加戊", "x": "困龙被伤，主官司破财，屈抑守分尚可，妄动则带来祸殃。但是如果用神是天盘的辛，那就不仅不凶，反而为吉，也可以说为客无害了。当然，由于子午相冲，挣到手的钱，也容易花掉，所以也有不吉的一面。只要辛与戊在一起必破财。测运气，不好，正身陷困境之象，没钱了。测什么事，这个事受伤、受困，不能自拔。此格，为没事找事，妄动必破财，不动就不破财。此格，是因为自己的错误导致的经济危机或事情的失败。注意：庚金一般代表的是外界带来的不良后果与影响；而辛金则是自己内部或因为内因造成的不良影响。"}, {"g": "辛", "d": "乙", "n": "白虎猖狂", "l": "凶", "t": "辛在上，乙在下，辛金主动冲克乙木，故名为“白虎猖狂”凶格，亦主家败人亡，远行多灾殃。测婚时遇此格，一般皆是男人主动离婚，把家拆散。", "pair": "辛加乙", "x": "白虎猖狂，家败人亡（分家、婚散、破产），出行有惊恐，远行多灾殃，尊长不喜，车船俱伤。测婚姻，离散，主因男人，是男人主动离婚，把家拆散。测疾病，病更猖狂了。测求财代表小问题，惹出了大麻烦。但测投资、举事，是可以做的。此格是个动格，利主不利客。修造、交易大凶。命盘遇“白虎猖狂，凶顽之辈”，说明此人凶狠顽固，不是善良人。"}, {"g": "辛", "d": "丙", "n": "干合悖师", "l": "门定", "t": "辛在上，丙在下，与前边的丙加辛相反，阴阳颠倒了，虽然二者仍然相合，但吉的程度就减了，故名为“干合悖师”格，即阴干辛与悖师丙相合。如果门吉则事也吉，门凶则事凶，如果合作求财，容易因财致讼。", "pair": "辛加丙", "x": "干合悖师，荧惑出现，占雨无，占晴旱，占事必因财致讼。门吉则无事；门凶，则事凶。测事，是在合作中出现乱子。本来两个人关系好，是合作伙伴，但后来打官司出现纠纷了。遇此格，只要合作，肯定出口舌官司是非。"}, {"g": "辛", "d": "丁", "n": "狱神得奇", "l": "吉", "t": "天盘为甲午辛，地盘为丁奇，甲午辛为罪人，又名狱神，故名为“狱神得奇”格。如果经商求财，可以获得加倍的利润；办其他事也会有意外的收获；如果犯了错误，也会免予处分，坐牢狱的囚犯，也会获得赦免。", "pair": "辛加丁", "x": "狱神得奇，经商求财获利倍增，囚人逢天赦释免，办其他事，也会有意外的收获。如果犯了错误，也会免于处分。坐牢狱的囚犯，也会获得赦免。此格，不利于婚姻，主第三者插足或是犯错误。辛想犯错误，丁给他纠正。男的是个败家子，女的给他把持，浪子回头金不换。丁有希望、解救之意，遇此格，被绊之事获得释解。乙、丙、丁都是奇，都是希望，但它们的层次是不一样的：临乙，受委屈才能成功；临丙，是乱中取胜；临丁，是直达的希望。"}, {"g": "辛", "d": "己", "n": "入狱自刑", "l": "凶", "t": "天盘为辛，地盘为己。辛为罪人，己为地户为监狱，故名为“入狱自刑”格。主错误由自己造成，奴仆背主，有苦诉讼难伸。", "pair": "辛加己", "x": "入狱自刑，辛为罪人，戌为午火之墓，故为入狱自刑，主奴仆背主，有苦诉讼难伸。就是说遇此格，错误都是因为自己的私欲造成的，是自己找的麻烦事，自酿的苦酒自己喝，有理也难辨。遇此格千万别帮人，帮了变仇人。别与人合作，主心里有苦难言，受委屈却无处发泄。为什么有理难辨？本来他是小人，是毒蛇，是中山狼，可你非去救他，他恩将仇报，是你自己的错误造成的，因此是奴欺主。测坟地风水遇此格，前面有更大的坟山或建筑物离坟头太近了。"}, {"g": "辛", "d": "庚", "n": "天狱自刑（白虎出力）", "l": "凶", "t": "因辛为天狱，遇庚同类相残，故名为“天狱自刑”格，又名为“白虎出力”格。主主客相残，刀刃相见，逊让退步稍可，强进血溅衣衫。", "pair": "辛加庚", "x": "白虎出力，刀刃相交，主客相残，逊让退步则安，强进血溅衣衫。就是两个老虎栓在一起，没好事、主伤灾、斗打。遇此格，宜静不宜动。逢动必出灾。此格不利合作，不利主动去做，越强行去做越倒霉。此格是因自己的错误，引来了外界的影响导致更大的问题发生。"}, {"g": "辛", "d": "辛", "n": "伏吟天庭", "l": "凶", "t": "即甲午辛加甲午辛。由于午午自刑，辛又名天狱、天庭，故名为“伏吟天庭”格，主为事自破，进退不果，公废私就，讼狱自遭罪名。", "pair": "辛加辛", "x": "伏吟天庭，公废私就，讼狱自罹罪名。此格主为事自破，进退不果，是一大堆错误在一起，这些错误都是自己造成的，怨不得别人。主毛病多多、漏洞百出。测罪人，是惯犯、二进宫。"}, {"g": "辛", "d": "壬", "n": "凶蛇入狱", "l": "凶", "t": "因辛为牢狱，壬为凶蛇，故名为“凶蛇入狱”格，主争讼不息，先动失理。又甲辰壬中辰为辛金之墓库，辛在上为客为动，一动必先入辰墓，故为“先动失理”。", "pair": "辛加壬", "x": "凶蛇入狱，因为壬为凶蛇，辛为牢狱，故名。两男争女，一货售两家、讼狱不息，先动失理，利主不利客。此格主犯罪、犯错误。遇此格最容易出现婚外恋、三角恋，而且是被两者同时发现了，引起争斗。壬水主缠绕，多数是两男争一女，多指男女关系引起的口舌是非。如果是女的来测，肯定是脚踩两只船。男的来测，则是破坏人家的家庭。测事，则表示发生三角连锁官司，牵连多人多面，是因为自己的过失，导致的竞争或同时受到了多方面的影响。"}, {"g": "辛", "d": "癸", "n": "天牢华盖（虎投地网）", "l": "凶", "t": "辛为天牢，癸为华盖，故名为“天牢华盖”格，主日月失明，误入天网，动止乖张。辛为白虎，癸为地网，故又名为“虎投地网”格。", "pair": "辛加癸", "x": "天牢华盖，日月失明，误入天网，动止乖张。辛为白虎、癸为地网，此格又叫虎投地网格。遇此格是指走错路了，是自己判断失误造成的。一失足成千古恨，牢狱是非，倒霉事就出来了。遇此格，测生意，不能干，判断失误。"}, {"g": "壬", "d": "戊", "n": "小蛇化龙", "l": "吉", "t": "与前边的戊加壬相反，换了主客关系，即甲辰壬在天盘为客为用神，地盘上是甲子戊，这一颠倒，变成了吉格，故名为“小蛇化龙”格。因壬为小蛇，甲为青龙，也可理解为由五甲甲辰壬变成了一甲元帅甲子戊，升迁发达了。所以主男人发达，女人产婴童。", "pair": "壬加戊", "x": "小蛇化龙，男人发达，女产婴童，做事要防耗散。测企业，企业发展要上新台阶。测事业运气，要转运了。测前途，是提升之象。测疾病不吉，小病要变大病了。此格，利于投资，遇贵人，有人提携帮助你，或者找到了强大的支撑因素。此格，风水好环境好，依山傍水见平川。"}, {"g": "壬", "d": "乙", "n": "小蛇得势", "l": "吉", "t": "与前边的乙加壬相反，颠倒了主客关系，变为阳在上、阴在下，符合一般事物规律，故名为“小蛇得势”格，因甲辰壬为第五甲，可称为一条“小蛇”，得“日奇”乙相助，故名“小蛇得势”。主女人柔顺，男人发达。如果测孕育，可生儿子，有工作有俸禄，出门还有车坐。", "pair": "壬加乙", "x": "小蛇得势，女人柔顺，男人通达。测孕育生子、禄马光华，出门有车坐。是在忧愁之中突然遇到了别人的帮助。遇此格，宜曲中求，不能直截了当的去办，要以柔克刚就好，别急躁。"}, {"g": "壬", "d": "丙", "n": "水蛇入火", "l": "凶", "t": "与前边的丙加壬相反，颠倒了主客关系，但仍然是互相冲克，天盘壬又名“水蛇”，故名为“水蛇入火”格，也为凶格，主官灾刑禁，络绎不绝，两败俱伤。", "pair": "壬加丙", "x": "水蛇入火，因为壬丙相冲克，故主官灾刑禁，络绎不绝，主两败俱伤，为客不利。遇此格，主口舌是非麻烦一大堆，忙中出乱子，越急越出乱子。越想干越乱，为客不利。"}, {"g": "壬", "d": "丁", "n": "干合蛇刑", "l": "门定", "t": "壬在上，丁在下。丁壬相合，壬又为小蛇，故名为“干合蛇刑”格。主文书牵连，贵人匆匆，男吉女凶。因天盘壬为阳为男，遇丁奇相合，自然为吉。而地盘丁为阴为女，上有天罗壬盖头，毕竟不吉。", "pair": "壬加丁", "x": "干合蛇刑，文书牵连，贵人匆匆，男吉女凶。因天盘壬水为阳为男，遇丁奇相合，自然为吉。而地盘丁，为阴为女，上有天罗壬水盖头，毕竟不吉。此格为合格，利于合作、谈判。遇此格，本来是要出乱子的，因为有机遇使乱子平息了。"}, {"g": "壬", "d": "己", "n": "反吟蛇刑", "l": "凶", "t": "壬在上，己在下，甲辰壬与甲戌己辰戌相冲，壬又为蛇，故名为“反吟蛇刑”凶格。主官司败诉，大祸将至，顺守可吉，妄动必凶。", "pair": "壬加己", "x": "反吟蛇刑，主官司败诉，大祸将至，顺守为吉，妄动必凶。己壬相遇斗讼场，壬丙相逢是非多。这是一个动格，是一对冤家，口舌是非，因为想好事，出现的矛盾，闹出的官司。这个局最好不要动，不然容易掉进别人设计的陷阱里、被人陷害。"}, {"g": "壬", "d": "庚", "n": "太白擒蛇", "l": "门定", "t": "因壬为蛇，庚为太白。蛇遇太白被阻，故名为“太白擒蛇”格。凡作为难以进展，但遇词讼，则会刑狱公平，立判邪正。", "pair": "壬加庚", "x": "太白擒蛇，因庚为太白，壬为蛇，故名。主刑狱公平，立判邪正，这是对于词讼之类来讲的。但就有何作为来讲，难以进展，为做事有阻之象。测学习，遇此格，老师有水平，能分清是非。测事也是邪正分明。总体上算是个吉格，是变化中的阻隔，可以融通，虽然有难度，但会发生好的变化。命盘遇此格，做政客、做科研、做教师比较好。一般都有正确的主见，不被其他事物或不利因素所迷惑，能够看清方向。对方临此格，你骗不了人家。如六合临此格，测婚姻或合作，找这样的中介比较好，中立、公正、秉公办事。"}, {"g": "壬", "d": "辛", "n": "螣蛇相缠", "l": "凶", "t": "壬在上，辛在下。辛金入辰墓，辰墓中有壬水，壬为螣蛇，又为天网，罩住辛金，故名为“螣蛇相缠”格，纵得吉门，也不能安宁，若有谋望，被人欺瞒。", "pair": "壬加辛", "x": "螣蛇相缠，纵得吉门，亦不能安。如有谋望，被人欺骗。遇此格，麻烦事一大堆，解决不了，到处都是，内忧外患，没完没了，没有正经事，但很棘手、缠人。测消息，若日干、时干、景门宫中遇到壬加辛格局，说明消息是道听途说、添油加醋、被人欺瞒，不可听信。"}, {"g": "壬", "d": "壬", "n": "天狱自刑（蛇入地罗）", "l": "凶", "t": "即甲辰壬加甲辰壬，壬为天罗，又名天狱，辰辰自刑，故名为“天狱自刑”格。又因壬为蛇，壬又名地罗，故又名为“蛇入地罗”格。主求谋无成，祸患起于内部，诸事主破败，外人缠绕，内事萦索。如果遇吉门吉星，尚可缓解困顿的处境。", "pair": "壬加壬", "x": "天狱自刑或蛇入地罗，壬为天罗又名天狱，辰辰自刑，故名。遇此格，主求谋无成，祸患起于内部，诸事主破败，外人缠绕，内事萦索。如遇吉门吉星，尚可缓解困顿的处境。此格主乱套了，内忧外患，主事因勾连越变越乱，一百个兔子拉车，按下葫芦浮起瓢，乱七八糟，没有秩序的乱。癸加癸，你不动就没事，但壬加壬，不管你动不动，它都找你，难以解决，找不到一个源头和突破口。"}, {"g": "壬", "d": "癸", "n": "天罗逢地网", "l": "凶", "t": "名为“天罗逢地网”格，诸事不利。又阳水在上，阴水在下，二水相遇，阴阳交和，玄武水又主暧昧之事，所以此格又名为“幼女奸淫”格，主有家丑外扬之事发生。如果门吉，尚可谓“风流男女”；如果星凶，说明本质上坏，且本性难改，故必然反福为祸，因男女暧昧之事招来凶灾。", "pair": "壬加癸", "x": "幼女奸淫，主有家丑外扬之事发生。门吉星凶，反福为祸。此格又叫天罗逢地网，诸事不利。因为阳水在上，阴水在下，两水相遇，阴阳交合；玄武水又主暧昧之事，所以此格称为幼女奸淫，主丑事。如果门吉，尚可谓风流男女。如果星凶，说明本质上坏，且本性难改，故必然反福为祸，因男女暧昧之事招来凶灾。"}, {"g": "癸", "d": "戊", "n": "天乙会合", "l": "门定", "t": "与前边的戊加癸相反，颠倒了主客关系。由于子水生寅木，戊与癸合，也就是说主客仍呈相生相合关系，所以名为“天乙会合”格。吉凶仍由门来决定，即逢吉门为吉，宜谋事求财，婚姻喜美，有吉人赞助成合。如逢凶门，或门宫迫制(即门宫相克)，则反而会招来祸害和官司是非。", "pair": "癸加戊", "x": "天乙会合，吉门宜求财，婚姻喜美，吉人赞助成合。若门凶迫制，反祸官非。此格也是个合格，有投资、钱财方面的合作之事。临惊门，合作打官司。遇此格，与他人他事有牵连。"}, {"g": "癸", "d": "乙", "n": "华盖逢星", "l": "门定", "t": "癸在上为客，乙在下为主。癸为地网，但高者可为华盖，故名为“华盖逢星”格，癸虽然多为凶的符号，但现在癸为用神，又得日奇相助，故对癸来说为吉。如果得吉门，则贵人禄位，常人平安；如果得凶门，自然就又凶了。", "pair": "癸加乙", "x": "华盖逢星，贵人禄位，常人平安。癸为地网，但高者可为华盖。癸水虽然多为凶的符号，但现在癸为用神又得日奇相助，故对癸水来说为吉。如果得吉门，则贵人禄位，常人平安；如果得凶门，自然就又凶了。遇此格，性格含蓄，做事内敛好，别太露锋芒，要悄悄的办。此格也主希望被网罩住了，有才难伸。"}, {"g": "癸", "d": "丙", "n": "华盖悖师", "l": "凶", "t": "与前边的丙加癸相反，阴阳颠倒，阴水癸在上，阳火丙在下。癸高者可称“华盖”，丙又为“悖师”，故名为“华盖悖师”格，贵贱逢之皆不利。只有修养高超、能屈能伸、善于因势利导的上等人物才能变不利为有利，反怒为喜。", "pair": "癸加丙", "x": "华盖悖师，贵贱逢之皆不利，唯上人见喜。只有修养高超，能屈能伸，善于因势利导的上等人物才能变不利为有利，反怒为喜。遇此格，易犯小人，忌讳女人参与。遇此格，利主不利客，一动就有乱子事。"}, {"g": "癸", "d": "丁", "n": "螣蛇夭矫", "l": "凶", "t": "癸在上，丁在下。地网阴水遇阴火，癸又名螣蛇，蛇被火烧烤，自然弯曲摆动不已，故名为“螣蛇夭矫”凶格，主文书官司，火焚也逃不掉。", "pair": "癸加丁", "x": "螣蛇夭矫，文书官司，火焚也逃不掉，虚惊不宁。合作必散伙，主口舌官司、争斗。测出行、合作，有是非，非打架不可。乘船、坐车有船翻车毁之险。测病，问题重了。测女人，一母老虎。测男人，不讲理，阴毒小人。测水，水开了。测风水——家宅不宁。测婚姻，是一个吵闹的天干组合。男子预测，妻子絮叨吵嚷；女子预测，丈夫口舌是非多。命盘遇“螣蛇夭矫，毒心小人”，此人心底贪毒。“失时者目盲耳聩，乘气者火焚伤身”，是说命盘遇丁加癸、癸加丁的格局，处死墓绝的状态，前者（丁加癸）眼睛不好，如近视眼、青光眼、失明等；后者（癸加丁）耳朵不好，如耳聋、耳背等；如果格局特别旺相，还要防止火灾、水灾等损伤身体。乙、丙、丁三奇遇到六仪，都为凶中有吉之象，但各有缺陷：丁遇到癸，就完了；丙遇到壬，力量马上消失；乙遇到辛，最凶。这些大凶之格，不能化解。"}, {"g": "癸", "d": "己", "n": "华盖地户", "l": "凶", "t": "与前边的己加癸相反，主客颠倒，癸在上可名华盖，故名为“华盖地户”凶格。男女测之，音信皆阻。此格躲灾避难方为吉。", "pair": "癸加己", "x": "华盖地户，男女测之，音信皆阻，躲灾避难方为吉。这是一个小冲格，不利于客，私欲幻想多。你安静、等待、退守、观看，就没有事，就应吉。但不管做什么事，只要动了，都有不利。纯阴不生，纯阳不长。单相思，办不成。"}, {"g": "癸", "d": "庚", "n": "太白入网", "l": "凶", "t": "癸在上，庚在下。癸又名地网，庚为太白，故名为“太白入网”格。由于寅申相冲相刑，所以凡事无成，吉事也易成空。又主以暴力争讼，自遭罪责。", "pair": "癸加庚", "x": "太白入网，主以暴力争讼，自罹罪责。由于寅申相冲相刑，所以凡事无成，吉事也易成空。遇此格，主打打争斗之事，相冲突，是因冲突、冲动造成的。庚是仇人，逢冲必乱，干什么都有难度，有别人来捣乱、破坏。"}, {"g": "癸", "d": "辛", "n": "网盖天牢", "l": "凶", "t": "癸在上，辛在下。癸为地网，辛为天牢，故名为“网盖天牢”格。主官司败诉，死罪难逃；测病亦大凶。", "pair": "癸加辛", "x": "网盖天牢，主官司败诉，死罪难逃。测病，亦大凶。落巽宫，易出牢狱之灾。遇到六仪击刑，主牢狱或伤灾。小孩遇此格，犯错误，不爱出门。遇此格最好不要动，你不动网就下不来，因此利静不利动。"}, {"g": "癸", "d": "壬", "n": "复见螣蛇", "l": "凶", "t": "癸在上，壬在下，阴阳颠倒。癸、壬均为水蛇，故名为“复见螣蛇”格。主嫁娶重婚，后嫁无子，不保年华。推而广之，主事物变化，另找主人，或另找合作伙伴。", "pair": "癸加壬", "x": "复见螣蛇，癸水、壬水均为水蛇，主嫁娶重婚，后嫁无子，不保年华。遇此格，主此事一再不成功。以前做过这事，现在又去想，但实现不了，表示重复之象，老想不能实现的事，“这张旧船票，还能否登上那条旧船”，涛声依旧，没有结果。"}, {"g": "癸", "d": "癸", "n": "天网四张", "l": "凶", "t": "癸为地网。上边是网，下边也是网，故名为“天网四张”格。天网四张，不可谋事，只宜退避。如果强行谋事，不仅无成，还会带来凶灾。故主行人失伴，病讼皆伤。“天网四张”格，如果落入一、二、三、四宫为网低，受困更重，最好退避忍耐为上，以等待时机。如果落入六、七、八、九宫，为网高，可匍匐而出，故尚可小心谨慎谋事，以逐步改变受困之境遇。", "pair": "癸加癸", "x": "天 function computeChart(y,mo,d,h){
  var term=getTerm(y,mo,d);
  if(!term)return null;
  var ti=term.ti, yin=(ti>=11&&ti<=22);
  var di=gzIndex(y,mo,d);
  var hB=Math.floor(((h+1)%24)/2);
  var hS=(di%10*2+hB)%10;
  var hi=-1;for(var n=0;n<60;n++){if(n%10===hS&&n%12===hB){hi=n;break;}}
  var xun=Math.floor(hi/10), xunS=xun*10, xunB=xunS%12, yi=XUNYI[xun];
  var fu=-1;
  for(var i2=di;i2>di-15;i2--){var ii=((i2%60)+60)%60;if(ii%10===0||ii%10===5){fu=ii;break;}}
  var fb=fu%12;
  var yuan=([0,6,3,9].indexOf(fb)>=0)?0:(([2,8,5,11].indexOf(fb)>=0)?1:2);
  var ju=JU[term.name][yuan];
  var dp={};var seq="戊己庚辛壬癸丁丙乙";
  for(var k=0;k<9;k++){var p= yin? (((ju-1-k)%9)+9)%9+1 : (ju-1+k)%9+1; dp[p]=seq[k];}
  function ridx(p){return RING.indexOf(p);}
  var pX=-1,pT=-1;
  var tgLook=(hS===0)?yi:STEMS[hS];
  for(var p2=1;p2<=9;p2++){if(dp[p2]===yi)pX=p2;if(dp[p2]===tgLook)pT=p2;}
  if(pT===5)pT=2;

  var zfStar=STARHOME[pX]||"天禽星", doorHome=DOORHOME[pX]||"死门";
  var offS=(ridx(pT)-ridx(pX)+8)%8;
  var tg={},starAt={},ruiPalace=2;
  for(var pp=1;pp<=9;pp++){
    if(pp===5)continue;
    var np=RING[(ridx(pp)+offS)%8];

    tg[np]=dp[pp];
    if(pp===2)ruiPalace=np;
  }
  var jg=dp[5];
  var steps=(hB-xunB+12)%12;
  var pos=pX;
  for(var s2=0;s2<steps;s2++){pos= yin? (pos===1?9:pos-1) : (pos%9)+1;}

  var offD=(ridx(pos)-ridx(pX)+8)%8;
  var menAt={};

  }
  var godAt={},gi=ridx(pT);

    godAt[RING[idx]]=GODS8[g2];
  }
  var marks={};for(var p3=1;p3<=9;p3++)marks[p3]=[];
  var msB=MASTAR[hB];
  for(var p5=1;p5<=9;p5++){if(PALBR[p5].indexOf(msB)>=0)marks[p5].push("马星");}
  KONG[xun].forEach(function(b){for(var p4=1;p4<=9;p4++){if(PALBR[p4].indexOf(b)>=0)marks[p4].push("空亡");}});
  var ag={};var STEMORDER=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
  var agStart=STEMORDER.indexOf(tgLook);
  for(var a2=0;a2<9;a2++){
    var stem2=STEMORDER[(agStart+a2)%9];
    var pp3= yin? (((5-1-a2)%9)+9)%9+1 : (5-1+a2)%9+1;
    ag[pp3]=stem2;
  }
var order=[4,9,2,3,5,7,8,1,6],out=[];
  order.forEach(function(p6){
    out.push({k:GONGNAME[p6],g:GONGTRI[p6],n:String(p6),

      tg:tg[p6]||"",dg:dp[p6],mark:marks[p6].filter(function(v,ix,a){return a.indexOf(v)===ix;}).join(" "),

  });

  return {cells:out,info:info};
}

function bjNow(){var d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000);}
function fillPan(n){
  document.getElementById("py").value=n.getFullYear();
  document.getElementById("pm").value=n.getMonth()+1;
  document.getElementById("pd").value=n.getDate();
  document.getElementById("ph").value=n.getHours();
  document.getElementById("pmin").value=n.getMinutes();
}
function initPan(){
  var n=bjNow();
  fillPan(n);
  var r=computeChart(n.getFullYear(),n.getMonth()+1,n.getDate(),n.getHours());
  PAN=r.cells;
  document.getElementById("paninfo").textContent=r.info;
  document.getElementById("btnnow").onclick=function(){
    var n2=bjNow();fillPan(n2);
    document.getElementById("btnqi").onclick();
  };
  document.getElementById("btnqi").onclick=function(){
    var y=+document.getElementById("py").value,mo=+document.getElementById("pm").value,
        d=+document.getElementById("pd").value,hh=+document.getElementById("ph").value,
        mi=+document.getElementById("pmin").value||0;
    if(!y||!mo||!d||isNaN(hh)||hh<0||hh>23||isNaN(mi)||mi<0||mi>59){alert("请输入正确的公历日期时间（时0-23，分0-59）");return;}
    var r2=computeChart(y,mo,d,Math.floor(hh));
    if(!r2){alert("该年份暂无节气数据（当前支持2023-2035年）");return;}
    PAN=r2.cells;CURPAN=0;
    document.getElementById("paninfo").textContent=r2.info;
    renderPanGrid();closePan();
  };
}
initPan();
renderPanGrid();
refresh();
